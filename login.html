<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="index.html">Book Store</a>
            <ul class="Links">
                <li><a href="index.html">Home</a></li>
                <li><a class="signup" href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Log In</h1>
            <p class="intro">Log in to continue exploring the library.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" >Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <div class="form-group">
                    <label for="accountType">Continue as</label>
                    <select id="accountType" name="accountType" required>
                        <option value="User" selected>User</option>
                        <option value="Admin">Admin (prototype)</option>
                        <option value="Guest">Guest</option>
                    </select>
                </div>

                <button href="index.html" class="primary-button" type="submit">Log In</button>
            </form>

            <p class="switch-page">Don't have an account? <a href="signup.html">Create one</a></p>
            <a class="back-link" href="index.html">← Back to Home</a>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 The Library. All rights reserved.</p>
    </footer>

<script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        window.location.href = "index.html";
    });
</script>

   
</body>

</html>
